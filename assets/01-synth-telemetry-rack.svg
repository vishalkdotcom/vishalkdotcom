  <defs>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1D24" />
      <stop offset="50%" stop-color="#12141A" />
      <stop offset="100%" stop-color="#0B0D11" />
    </linearGradient>
    <linearGradient id="moduleFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#20242D" />
      <stop offset="100%" stop-color="#161920" />
    </linearGradient>
    <linearGradient id="crtGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041511" />
      <stop offset="50%" stop-color="#020D0A" />
      <stop offset="100%" stop-color="#051B15" />
    </linearGradient>
    <linearGradient id="cableCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00BBF9" />
    </linearGradient>
    <linearGradient id="cableCoral" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E5B" />
      <stop offset="100%" stop-color="#FF9F1C" />
    </linearGradient>
    <filter id="phosphorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="cableShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <pattern id="crtGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#0E382C" stroke-width="0.75" />
    </pattern>
