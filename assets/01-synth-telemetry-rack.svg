  <style>
    .mono { font-family: "JetBrains Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .silk { fill: #9BA3B0; font-size: 9.5px; font-weight: 700; letter-spacing: 0.12em; }
    .silk-hi { fill: #E8ECEF; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
    .silk-gold { fill: #F5B700; font-size: 9.5px; font-weight: 700; letter-spacing: 0.14em; }
    .crt-txt { fill: #00F5D4; font-size: 10.5px; font-weight: 600; }
    .crt-warn { fill: #FF5E5B; font-size: 10.5px; font-weight: 600; }
    .crt-dim { fill: #3CAEA3; font-size: 9.5px; }
    .screw { fill: #2B303C; stroke: #0E1015; stroke-width: 1.5; }
    .jack-outer { fill: #101216; stroke: #7C8594; stroke-width: 2; }
    .jack-inner { fill: #050608; }
    .led-green { fill: #00F5D4; }
    .led-amber { fill: #FFBE0B; }
    .led-red { fill: #FF5E5B; }

    @keyframes pulseLed {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes sweepWave {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes swayCable {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(2.5px); }
    }
    .blink { animation: pulseLed 2.4s infinite ease-in-out; }
    .blink-fast { animation: pulseLed 1.1s infinite ease-in-out; }
    .wave-anim { stroke-dasharray: 600; animation: sweepWave 5s infinite linear; }
  </style>

