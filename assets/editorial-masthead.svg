<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 185" width="100%" role="img" aria-label="Vishal Kumar - Editorial Broadsheet Masthead">
  <title>The Engineering Broadsheet - Vishal Kumar</title>
  <style>
    .bg { fill: #fbfaf6; }
    .border { fill: none; stroke: #181715; stroke-width: 2; }
    .rule-heavy { stroke: #181715; stroke-width: 2; }
    .rule-thin { stroke: #181715; stroke-width: 0.75; }
    .rule-muted { stroke: #c9c5b8; stroke-width: 1; }
    .ink { fill: #141311; }
    .muted { fill: #5c5952; }
    .accent { fill: #9e2a2b; }
    .serif { font-family: Georgia, "Times New Roman", Times, serif; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #121110; }
      .border { stroke: #e6e1d6; }
      .rule-heavy { stroke: #e6e1d6; }
      .rule-thin { stroke: #e6e1d6; }
      .rule-muted { stroke: #33302b; }
      .ink { fill: #f2ede2; }
      .muted { fill: #a39e93; }
      .accent { fill: #e06d53; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="880" height="185" rx="4" />
  <line class="rule-heavy" x1="16" y1="14" x2="864" y2="14" />
  <line class="rule-thin" x1="16" y1="18" x2="864" y2="18" />

  <text class="mono muted" x="20" y="34" font-size="10" letter-spacing="0.1em">VOL. XIII | NO. 144 | PUNJAB, INDIA (REMOTE)</text>
  <text class="mono accent" x="440" y="34" font-size="10" font-weight="600" letter-spacing="0.12em" text-anchor="middle">EVIDENCE-FIRST PRODUCT ENGINEERING</text>
  <text class="mono muted" x="860" y="34" font-size="10" letter-spacing="0.08em" text-anchor="end">VISHALK.COM | HELLO@VISHALK.COM</text>

  <line class="rule-muted" x1="16" y1="42" x2="864" y2="42" />

  <text class="serif ink" x="440" y="96" font-size="50" font-weight="700" letter-spacing="-0.02em" text-anchor="middle">VISHAL KUMAR</text>
  <text class="serif muted" x="440" y="122" font-size="15" font-style="italic" text-anchor="middle">Senior Frontend Engineer - Reporting Surfaces, Multilingual Admin Platforms &amp; Verified Architecture</text>

  <line class="rule-muted" x1="16" y1="136" x2="864" y2="136" />

  <!-- Four dispatch callouts -->
  <text class="mono accent" x="24" y="154" font-size="9.5" font-weight="600">I. SCORE AUTHORITY</text>
  <text class="sans ink" x="24" y="168" font-size="11">54.31 vs 54.90 drift eliminated</text>

  <line class="rule-muted" x1="230" y1="140" x2="230" y2="174" />
  <text class="mono accent" x="244" y="154" font-size="9.5" font-weight="600">II. BUILD VELOCITY</text>
  <text class="sans ink" x="244" y="168" font-size="11">84.5s -&gt; 40.6s (2.08x hyperfine)</text>

  <line class="rule-muted" x1="450" y1="140" x2="450" y2="174" />
  <text class="mono accent" x="464" y="154" font-size="9.5" font-weight="600">III. BUNDLE DISCIPLINE</text>
  <text class="sans ink" x="464" y="168" font-size="11">164 KiB vs 350 KiB migration veto</text>

  <line class="rule-muted" x1="678" y1="140" x2="678" y2="174" />
  <text class="mono accent" x="692" y="154" font-size="9.5" font-weight="600">IV. AI-NATIVE RIGOR</text>
  <text class="sans ink" x="692" y="168" font-size="11">Spec-first | 100% human-owned</text>

  <line class="rule-thin" x1="16" y1="176" x2="864" y2="176" />
  <line class="rule-heavy" x1="16" y1="180" x2="864" y2="180" />
</svg>
