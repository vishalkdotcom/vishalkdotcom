    .star-title { fill: #F8FAFC; font-size: 12px; font-weight: 700; }
    .star-sub { fill: #94A3B8; font-size: 10px; }
    .star-metric { fill: #38BDF8; font-size: 10px; font-weight: 700; }

    @keyframes slowPulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.18); opacity: 0.45; }
    }
    .pulse-ring { transform-origin: center; transform-box: fill-box; animation: slowPulse 4s infinite ease-in-out; }
