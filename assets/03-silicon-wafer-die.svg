<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" role="img" aria-label="Vishal Kumar - Isometric Silicon Die &amp; Wafer Interconnect">
  <title>Vishal Kumar -- Senior Frontend Engineer // VK-2026 Custom Silicon Die</title>
  <defs>
    <linearGradient id="pcbSubstrate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061A14" />
      <stop offset="50%" stop-color="#04120E" />
      <stop offset="100%" stop-color="#020A07" />
    </linearGradient>
    <linearGradient id="goldTrace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="dieSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <pattern id="pcbGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#0F3D2E" />
    </pattern>
    <filter id="traceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: "JetBrains Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .silk-gold { fill: #FBBF24; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; }
    .silk-white { fill: #F8FAFC; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
    .silk-dim { fill: #6EE7B7; font-size: 9.5px; opacity: 0.8; }
    .pin-pad { fill: url(#goldTrace); stroke: #78350F; stroke-width: 0.8; }
    .bus-line { fill: none; stroke: #10B981; stroke-width: 1.5; stroke-opacity: 0.45; }
    .bus-active { fill: none; stroke: #FDE047; stroke-width: 2; stroke-dasharray: 12 180; animation: packetFlow 3.2s infinite linear; }

    @keyframes packetFlow {
      0% { stroke-dashoffset: 192; }
      100% { stroke-dashoffset: 0; }
    }
  </style>

