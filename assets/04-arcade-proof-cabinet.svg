    .arcade-hdr { fill: #FFE600; font-size: 11px; font-weight: 800; letter-spacing: 0.14em; }
    .arcade-cyan { fill: #00F5D4; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
    .arcade-pink { fill: #FF2A85; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
    .arcade-white { fill: #FFFFFF; font-size: 11.5px; font-weight: 700; }

    @keyframes coinBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.15; }
    }
    .coin-blink { animation: coinBlink 1.4s infinite; }
  </style>

